name: 更新并发布 AI 阅读器

on:
  push:
    branches: [main]
    # Don't recursively trigger another run on data refresh commits.
    paths:
      - index.html
      - scripts/update.py
      - requirements.txt
      - .github/workflows/publish.yml
  schedule:
    # UTC 00:17, 08:17, 16:17 = Beijing 08:17, 16:17, 00:17
    - cron: '17 0,8,16 * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

concurrency:
  group: rss-pages
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh feeds
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install free dependencies
        run: python -m pip install -r requirements.txt
      - name: Collect public RSS and papers
        run: python scripts/update.py
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/articles.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh AI research feeds"
            git push origin HEAD:main
          fi

  deploy:
    name: Deploy GitHub Pages
    needs: refresh
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Wait for artifact indexing
        run: sleep 10
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
