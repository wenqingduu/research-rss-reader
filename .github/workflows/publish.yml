name: 更新并发布 AI 阅读器

on:
  push:
    branches: [main]
    # Data commits from this workflow must NOT recursively trigger it.
    paths:
      - index.html
      - scripts/update.py
      - requirements.txt
      - .github/workflows/publish.yml
  schedule:
    # UTC 00:17, 08:17, 16:17 = Beijing 08:17, 16:17, 00:17
    - cron: '17 0,8,16 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "rss-pages"
  cancel-in-progress: false

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install free dependencies
        run: python -m pip install -r requirements.txt
      - name: Collect research sources
        run: python scripts/update.py
      - name: Save latest article data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/articles.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh AI research feeds"
            git push
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy site
        id: deploy
        uses: actions/deploy-pages@v4
